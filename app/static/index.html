<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forex Course Signal Bot</title>
<style>
body{font-family:Arial,sans-serif;background:#0b1020;color:#eef2ff;margin:0}
.wrap{max-width:1200px;margin:auto;padding:24px}
.card{background:#151c31;border:1px solid #2b3658;border-radius:14px;padding:16px;margin-bottom:16px}
h1{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.badge{display:inline-block;padding:7px 10px;border-radius:8px;background:#26304d}
.buy{color:#65e6a7}.sell{color:#ff7272}.wait{color:#ffd66b}
pre{white-space:pre-wrap;word-break:break-word}
.small{color:#aab4d0;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>Forex Course Signal Bot — Precise Engine</h1>
<div class="card" id="status">Connecting...</div>
<div id="cards"></div>
<div class="card"><h3>Rule model</h3>
<div class="small">HTF bias → premium/discount → liquidity → LTF structure → displacement → POI/FVG → structural SL → external-liquidity TP. The engine uses OHLC proxies for discretionary concepts.</div>
</div>
</div>
<script>
const cards=document.getElementById("cards");
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(s){
 const cls=s.direction==="BUY"?"buy":s.direction==="SELL"?"sell":"wait";
 return `<div class="card">
 <h2 class="${cls}">${esc(s.direction)} — ${esc(s.symbol)}</h2>
 <div class="grid">
 <div><b>Status</b><br>${esc(s.status)}</div>
 <div><b>Score</b><br>${esc(s.score)}/${esc(s.max_score)}</div>
 <div><b>Bias</b><br>${esc(s.bias)}</div>
 <div><b>Location</b><br>${esc(s.pd_zone)}</div>
 <div><b>Liquidity</b><br>${esc(s.liquidity)}</div>
 <div><b>POI</b><br>${esc(s.poi)}</div>
 <div><b>Entry</b><br>${esc(s.entry)}</div>
 <div><b>SL</b><br>${esc(s.sl)}</div>
 <div><b>TP</b><br>${esc(s.tp)}</div>
 </div>
 <h4>Passed conditions</h4><pre>${esc((s.reasons||[]).join("\\n")||"None")}</pre>
 <h4>Warnings</h4><pre>${esc((s.warnings||[]).join("\\n")||"None")}</pre>
 </div>`;
}
async function load(){
 const st=await fetch("/api/status").then(r=>r.json());
 document.getElementById("status").innerHTML=
  `<b>Data:</b> ${esc(st.provider)} &nbsp; <b>Execution:</b> ${esc(st.execution_tf)} &nbsp; <b>Min score:</b> ${esc(st.min_score)} &nbsp; <b>RR fallback:</b> ${esc(st.rr)}R`;
 const x=await fetch("/api/signals").then(r=>r.json());
 cards.innerHTML=x.signals.slice(-20).reverse().map(render).join("")||'<div class="card">No confirmed signals yet.</div>';
}
load(); setInterval(load,10000);
</script>
</body>
</html>
